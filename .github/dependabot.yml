# Automated dependency updates. Dependabot opens pull requests only; every
# update still goes through the normal review and CI checks.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates

version: 2
updates:
  # --- Frontend ---
  # `npm` is Dependabot's name for the whole Node ecosystem; it reads
  # pnpm-lock.yaml. There is no separate "pnpm" value.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps"
    ignore:
      # Tauri requires matching JS/Rust minor versions. Upgrade these together
      # with src-tauri/Cargo.lock; independent JS minor bumps fail native builds.
      - dependency-name: "@tauri-apps/api"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "@tauri-apps/plugin-*"
        update-types: ["version-update:semver-minor"]
    groups:
      webdriverio-major:
        patterns:
          - "@wdio/*"
          - "webdriverio"
        update-types:
          - "major"
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # --- Rust backend and local Tauri plugins ---
  - package-ecosystem: "cargo"
    directories:
      - "/src-tauri"
      - "/tauri-plugin-screentime"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps(rust)"
    groups:
      cargo-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # --- GitHub Actions ---
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns:
          - "*"
