# Run the Rust unit tests (`src-tauri/src/**/#[cfg(test)]`) on PRs that touch
# the backend, and on the resulting commits on main. Kept out of ci.yml so
# frontend-only PRs do not pay for a macOS runner, mirroring how android-ci.yml
# isolates the Android toolchain.
#
# macOS is the only host that compiles every tested module: `web_automation`,
# `window_inventory` and `workspace_events` are `#[cfg(target_os = "macos")]`,
# and the `cfg(not(ios|android))` modules pull macOS/Windows-only dependencies
# (sysinfo, tauri-plugin-notification), so a Linux runner cannot build the lib
# at all. The Windows-only UI Automation tests run in the Windows desktop job.
name: Rust CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'src-tauri/**'
      - 'scripts/build-safari-bridge.sh'
      - '.github/workflows/rust-ci.yml'
  # Duplicated rather than anchored — GitHub Actions does not support YAML
  # aliases. Keep the two lists in sync.
  push:
    branches: [main]
    paths:
      - 'src-tauri/**'
      - 'scripts/build-safari-bridge.sh'
      - '.github/workflows/rust-ci.yml'

concurrency:
  group: rust-ci-${{ github.ref }}
  # See ci.yml: superseded PR runs are wasted work, but every main commit should
  # get its own verdict.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  rust:
    name: Rust unit tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      # `tauri_build::build()` (invoked from src-tauri/build.rs) validates that
      # the configured frontendDist — ../dist — exists, so the lib does not
      # compile on a clean checkout until the frontend has been built once.
      - run: pnpm vite:build
      # `--lib` on purpose: bare `cargo test` also compiles the stale
      # `test_watcher` example binary, which no longer builds (see testing.md).
      # build.rs compiles the Swift SafariServices bridge first; macOS runners
      # ship the Xcode toolchain it needs.
      #
      # `--locked` on purpose too: without it, a Cargo.lock that has drifted
      # out of sync with Cargo.toml is silently re-resolved in every checkout
      # instead of failing, so the committed lock stops pinning anything and
      # every developer gets a different dependency graph. Adding or bumping a
      # dependency now requires committing the regenerated lock alongside it.
      - name: cargo test --lib
        working-directory: src-tauri
        run: cargo test --lib --locked
      # The system-test app's isolation guarantees — that it can never read,
      # import, or wipe production data — are asserted by tests that only
      # exist under `--features system-test`, so the default run above
      # compiles them out entirely. Debug profile is required: `system-test`
      # implies `e2e-webdriver`, which `lib.rs` refuses to compile in release.
      - name: cargo test --lib --features system-test
        working-directory: src-tauri
        run: cargo test --lib --features system-test --locked

  # Static analysis for the desktop enforcement engine. The Android job's
  # clippy run compiles out everything gated `cfg(not(any(ios, android)))` —
  # app_watcher, enforcer, native_host, profile_scan — plus every macOS- and
  # Windows-only module, so roughly 60% of src-tauri/src had no lint coverage
  # at all until this job existed.
  #
  # Both hosts, because the two see genuinely different code: most of the
  # dead-code and cfg-dispatch findings here are live on one platform and dead
  # on the other, and a macOS-only gate would demand deleting Windows code.
  # There is no Linux entry — the lib does not compile there (see the header).
  clippy:
    name: Clippy (desktop, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
          key: clippy-${{ matrix.os }}
      - run: pnpm install --frozen-lockfile
      # Same reason as the test job: build.rs validates that ../dist exists.
      - run: pnpm vite:build
      # `--lib --bins --tests` includes the native-host entrypoint and unit
      # tests while still skipping the stale `test_watcher` example.
      - name: cargo clippy --lib --bins --tests
        working-directory: src-tauri
        run: cargo clippy --lib --bins --tests --locked -- -D warnings
      - name: Windows UI Automation regression tests
        if: runner.os == 'Windows'
        working-directory: src-tauri
        run: cargo test --lib --locked uia_web_automation::tests
