# PR checks: lint, build the frontend bundle, and run the Tier 1 logic suite
# headlessly. Rust tests run separately in rust-ci.yml.
#
# Also runs on every push to main. PR checks run against the merge preview, not
# the commit that ends up on main, so a green PR can still land a broken main
# when another PR merges in between (there is no merge queue). Anything that
# reaches main outside a PR — direct pushes, admin merges, the release
# workflow's own latest-versions.json commit — is only covered here.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs are wasted work, but every main commit should get its own
  # verdict — otherwise a rapid second merge hides the first one's result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Formatting and static analysis. Deliberately unfiltered by path and on the
  # cheapest runner: rustfmt needs no compilation and no system libraries, so
  # the whole job is dominated by checkout and toolchain setup.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # js/recommended only. `no-unused-vars` is a warning for now (see
      # eslint.config.mjs), so this fails on correctness findings —
      # no-undef, no-dupe-keys and friends — not on the dead-import backlog.
      - run: pnpm lint
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt
      - name: cargo fmt --check (src-tauri, tauri-plugin-screentime)
        working-directory: src-tauri
        run: cargo fmt --all --check

  frontend:
    name: Frontend bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Compiles the whole src/ ES-module graph and the index.html entry.
      # Fails on syntax errors, duplicate declarations, unresolved imports.
      - run: pnpm vite:build

  tier0:
    name: Tier 0 unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Plain vitest over the pure helpers in src/. No browser, no built
      # bundle, no native toolchain — it is the cheapest suite here and is
      # deliberately unfiltered by path for the same reason as `lint`.
      - run: pnpm test:tier0

  tier1:
    name: Tier 1 logic tests (headless)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Install the browser revision required by the locked test runner.
      - run: pnpm exec playwright install --with-deps chromium
      # Boots the Vite dev server, runs runBlockingTests() in headless
      # Chromium, fails on any failed assertion or a mid-suite crash.
      - run: pnpm test:tier1

  ios-activity-timing:
    name: iOS one-off activity timing
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Foundation-only Swift tests do not require Xcode or Screen Time
      # entitlements, so this stays a small macOS regression job. The job name
      # is unchanged in case branch protection requires this check by name.
      - run: bash scripts/ci/test-ios-activity-timing.sh
      - run: bash scripts/ci/test-ios-schedule-registration.sh
      - run: bash scripts/ci/test-ios-schedule-data.sh
      - run: bash scripts/ci/test-ios-start-warnings.sh
