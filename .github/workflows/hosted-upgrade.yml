name: Hosted installed upgrade

on:
  workflow_dispatch:
  push:
    branches: [codex/hosted-expiry-restart]
    paths:
      - '.github/workflows/hosted-upgrade.yml'
      - 'e2e/hosted-feasibility/**'

permissions:
  contents: read

concurrency:
  group: hosted-upgrade-${{ github.ref }}
  cancel-in-progress: false

jobs:
  upgrade:
    name: Installed upgrade ${{ matrix.scenario }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
        scenario: [upgrade-active, restart, expiry]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/src-tauri/target
      HOSTED_ARTIFACTS_DIR: ${{ github.workspace }}/artifacts/hosted-upgrade
      HOSTED_SCENARIO: ${{ matrix.scenario }}
      HOSTED_UPGRADE: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: c1567ce38b3f52c61ca0a6c92b9041d409906657 # v3.10.1
          path: artifacts/upgrade-baseline
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            src-tauri
            artifacts/upgrade-baseline/src-tauri
          key: installed-upgrade-${{ matrix.os }}
          cache-on-failure: true
      - run: pnpm install --frozen-lockfile --store-dir artifacts/pnpm-store
      - name: Install baseline dependencies locally to the checkout
        working-directory: artifacts/upgrade-baseline
        run: pnpm install --frozen-lockfile --store-dir ../pnpm-store
      - name: Test ownership, protocol and package verification guards
        run: node --test e2e/hosted-feasibility/helpers.test.js e2e/hosted-feasibility/native.test.js e2e/hosted-feasibility/upgrade/install.test.js
      - name: Build baseline and candidate debug installers
        run: node e2e/hosted-feasibility/upgrade/build.js
      - name: Install baseline, exercise policy, upgrade and verify continuity
        run: node e2e/hosted-feasibility/run.js
      - name: Preserve every attempt and both debug installers
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installed-debug-${{ matrix.scenario }}-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/hosted-upgrade/
            artifacts/upgrade-packages/
            !artifacts/upgrade-packages/*-payload/**
          if-no-files-found: warn
          retention-days: 14
