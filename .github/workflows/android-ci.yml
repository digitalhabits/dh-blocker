# Build a debug Android APK only when files that can affect the Android app
# change, on PRs and on the resulting commits on main. The general CI workflow
# covers the fast frontend checks for every PR.
name: Android CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'tauri-plugin-android-blocker/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - 'scripts/run-tauri.js'
      - '.github/workflows/android-ci.yml'
  # Duplicated rather than anchored — GitHub Actions does not support YAML
  # aliases. Keep the two lists in sync.
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'tauri-plugin-android-blocker/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - 'scripts/run-tauri.js'
      - '.github/workflows/android-ci.yml'

concurrency:
  group: android-ci-${{ github.ref }}
  # See ci.yml: superseded PR runs are wasted work, but every main commit should
  # get its own verdict.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  android:
    name: Android debug + release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - name: Install Android SDK packages + NDK
        run: |
          sdkmanager --install "platform-tools" "platforms;android-36" \
            "build-tools;36.0.0" "ndk;27.2.12479018"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: aarch64-linux-android
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
          # Keep Cargo dependency downloads reusable, but do not persist the
          # large cross-compiled target/ tree for every pull request.
          cache-targets: false
      - run: pnpm install --frozen-lockfile
      # Real Android build: compiles the aarch64 Rust lib (exercises the
      # #[cfg(target_os = "android")] command surface) and assembles a debug
      # APK via Gradle. Single ABI to keep CI time down.
      - name: Build debug APK
        run: pnpm build:android:debug
      # Clippy piggybacks on this job because it is the only CI runner with the
      # aarch64-linux-android target already installed and its Cargo cache warm
      # — the APK build above has just compiled the same lib, so this is
      # essentially free.
      #
      # Scope caveat: on this target every module gated
      # `cfg(not(any(ios, android)))` drops out — app_watcher, enforcer,
      # native_host, native_host_install, extension_install, blocking_method,
      # profile_scan, data_cache — on top of the macOS/Windows-only ones. That
      # is ~11k of the ~18k lines in src-tauri/src, so this lints the shared
      # command surface and nothing of the desktop enforcement engine. It is
      # green at -D warnings today; the desktop side is not, and wiring clippy
      # there is a separate cleanup.
      #
      # `--lib` on purpose, matching rust-ci.yml: --all-targets would drag in
      # the stale test_watcher example, which no longer builds.
      - name: cargo clippy (Android target)
        working-directory: src-tauri
        run: cargo clippy --lib --target aarch64-linux-android -- -D warnings
      # Pure-JVM tests for BrowserUrlParser (the URL-bar extraction the whole
      # Android website block depends on). Runs *after* the APK build because
      # Gradle cannot configure the project standalone: settings.gradle applies
      # the generated, gitignored tauri.settings.gradle, which is what pulls in
      # :tauri-android and :tauri-plugin-android-blocker. The Tauri CLI writes
      # it during the build above.
      - name: Kotlin unit tests
        working-directory: src-tauri/gen/android
        run: ./gradlew :tauri-plugin-android-blocker:testDebugUnitTest
      - name: Upload Kotlin test report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kotlin-unit-test-report
          path: tauri-plugin-android-blocker/android/build/reports/tests/
          if-no-files-found: ignore
      # The debug build above does not reach the release packaging path, and the
      # two are not interchangeable: release merges consumer ProGuard files, runs
      # R8, runs lintVital, and strips native libraries. Every one of those has
      # broken a release build while this job stayed green — a missing
      # `consumer-rules.pro` in the Tauri plugin crates and a lint crash both shipped
      # to `main` unnoticed, and `scripts/build-android-play.sh` runs these same
      # tasks. Single ABI again, for the same reason as the debug build.
      #
      # Runs last: it is the slowest step, so a failure in the cheap checks above
      # surfaces without waiting for it.
      - name: Build release APK (packaging path)
        run: pnpm tauri android build --apk --target aarch64
      # Guards `strip = true` in [profile.release]. AGP's own strip task only
      # removes DWARF sections, and a Cargo release build emits none — so if the
      # profile setting is ever dropped, nothing in the Android toolchain notices
      # and the symbol table silently returns to the APK (~4 MB per ABI).
      - name: Assert release libraries are stripped
        run: |
          set -euo pipefail
          apk=$(find src-tauri/gen/android/app/build/outputs/apk/universal/release \
                  -name '*.apk' -print -quit)
          if [ -z "$apk" ]; then
            echo "::error::release build produced no APK"
            exit 1
          fi
          ls -l "$apk"
          unzip -o -q "$apk" 'lib/arm64-v8a/*.so' -d "$RUNNER_TEMP/release-apk"
          readelf="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          if "$readelf" -S -W "$RUNNER_TEMP/release-apk/lib/arm64-v8a/libredd_block_lib.so" \
               | grep -qE '\.(symtab|strtab)\b'; then
            echo "::error::Release library still carries a symbol table. Is strip = true still set in [profile.release] (src-tauri/Cargo.toml)? See docs/android-build.md."
            exit 1
          fi
          echo "release libraries are stripped"
