# Tier 2 end-to-end run: builds the app with the test runners kept in the
# bundle, then drives runIntegrationTests() through a WebDriver session
# attached to the real app's webview. Unlike Tier 1 this exercises the actual
# Tauri command layer.
#
# Both jobs use the embedded WebDriver server (the `e2e-webdriver` Cargo
# feature), which is debug-only by construction — lib.rs fails to compile if it
# is ever combined with a release profile. Linux is not covered because the app
# does not build there.
#
# Tier 2 mutates real state — it writes the data file and drives the block
# pipeline. That is exactly why it stays manual locally and belongs on a
# disposable runner VM. Its domains are all `.invalid` by construction.
name: E2E CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'src/integration-tests.js'
      - 'src/test-utils.js'
      - 'e2e/**'
      - 'vite.config.js'
      - '.github/workflows/e2e-ci.yml'
  # Duplicated rather than anchored — GitHub Actions does not support YAML
  # aliases. Keep the two lists in sync.
  push:
    branches: [main]
    paths:
      - 'src/integration-tests.js'
      - 'src/test-utils.js'
      - 'e2e/**'
      - 'vite.config.js'
      - '.github/workflows/e2e-ci.yml'

concurrency:
  group: e2e-ci-${{ github.ref }}
  # Superseded PR runs are wasted work, but every main commit should get its
  # own verdict.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  tier2:
    name: Tier 2 (Windows, WebDriver)
    runs-on: windows-latest
    env:
      # scripts/build-env.js otherwise redirects Cargo's target dir to a
      # per-user cache outside the workspace (so linked worktrees can share
      # one dependency graph). Pin it into the workspace on CI so rust-cache
      # actually caches the build and the binary lands where the job expects.
      CARGO_TARGET_DIR: ${{ github.workspace }}/src-tauri/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      # No tauri-driver: the app serves WebDriver itself via the
      # `e2e-webdriver` feature. tauri-driver is the documented Windows path
      # but never established a session here (POST /session timed out at
      # 180 s, twice), while the embedded server was already green on macOS.
      # --config swaps beforeBuildCommand to the e2e Vite mode so the built
      # binary embeds a bundle that still contains the test runners.
      - name: Build app under test
        run: pnpm build:e2e-app
      - name: Run Tier 2
        run: pnpm test:tier2
      - name: Upload WDIO logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tier2-wdio-logs
          path: logs/
          if-no-files-found: ignore

  tier2-macos:
    name: Tier 2 (macOS, embedded WebDriver)
    runs-on: macos-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/src-tauri/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      # macOS has no WKWebView driver at all, so the embedded server is the
      # only option here — and now the shared one.
      - name: Build app under test
        run: pnpm build:e2e-app
      - name: Run Tier 2
        run: pnpm test:tier2
      - name: Upload WDIO logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tier2-wdio-logs-macos
          path: logs/
          if-no-files-found: ignore
